<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FF5B4A">
<title>Stampd Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23FF5B4A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/admin.css?v=20261026b">
</head>
<body>
<div class="admin" id="art">
  <aside class="sidebar" aria-label="Admin navigation">
    <div class="brand">
      <svg width="28" height="28" viewBox="-4 -4 108 108" aria-hidden="true">
        <path d="M5.60 0.00L14.40 0.00A5.6 5.6 0 0 0 25.60 0.00L34.40 0.00A5.6 5.6 0 0 0 45.60 0.00L54.40 0.00A5.6 5.6 0 0 0 65.60 0.00L74.40 0.00A5.6 5.6 0 0 0 85.60 0.00L94.40 0.00A5.6 5.6 0 0 0 100.00 5.60L100.00 14.40A5.6 5.6 0 0 0 100.00 25.60L100.00 34.40A5.6 5.6 0 0 0 100.00 45.60L100.00 54.40A5.6 5.6 0 0 0 100.00 65.60L100.00 74.40A5.6 5.6 0 0 0 100.00 85.60L100.00 94.40A5.6 5.6 0 0 0 94.40 100.00L85.60 100.00A5.6 5.6 0 0 0 74.40 100.00L65.60 100.00A5.6 5.6 0 0 0 54.40 100.00L45.60 100.00A5.6 5.6 0 0 0 34.40 100.00L25.60 100.00A5.6 5.6 0 0 0 14.40 100.00L5.60 100.00A5.6 5.6 0 0 0 0.00 94.40L0.00 85.60A5.6 5.6 0 0 0 0.00 74.40L0.00 65.60A5.6 5.6 0 0 0 0.00 54.40L0.00 45.60A5.6 5.6 0 0 0 0.00 34.40L0.00 25.60A5.6 5.6 0 0 0 0.00 14.40L0.00 5.60A5.6 5.6 0 0 0 5.60 0.00Z M50 18C38.4 18 30 27.2 30 39.2C30 54.5 50 78 50 78S70 54.5 70 39.2C70 27.2 61.6 18 50 18Z" fill="#FFFFFF" fill-rule="evenodd"/>
        <path d="M50 31L51.6 36.2L57 37.8L51.6 39.4L50 44.6L48.4 39.4L43 37.8L48.4 36.2Z" fill="#FFFFFF"/>
      </svg>
      <div>
        <div class="word">Stampd</div>
        <div class="sub">Admin</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="sec">Product</div>
      <button type="button" class="active" data-go="overview" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 3h5v5H3V3zm7 0h5v5h-5V3zM3 10h5v5H3v-5zm7 0h5v5h-5v-5z" stroke="currentColor" stroke-width="1.6"/></svg>
        Overview
      </button>
      <button type="button" data-go="countries">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 9h13M9 2.5c2 2.2 2 10.8 0 13M9 2.5c-2 2.2-2 10.8 0 13" stroke="currentColor" stroke-width="1.4"/></svg>
        Countries
      </button>
      <button type="button" data-go="places">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M6 11.5l2.2-2.8 1.8 1.6L12.5 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Places / stamps
      </button>
      <button type="button" data-go="users">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M4 14.5c.8-2.4 2.6-3.5 5-3.5s4.2 1.1 5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Users
      </button>
      <div class="sec">Growth</div>
      <button type="button" data-go="ads">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 12.5V5.5l12-2v11l-12-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 8.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Ads / promotions
      </button>
      <button type="button" data-go="trade">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 7h10M11 4l3 3-3 3M14 11H4M7 14l-3-3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Trade &amp; coins
      </button>
      <div class="sec">Ops</div>
      <button type="button" data-go="moderation">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3.5 4.5h11v8.5a1 1 0 01-1 1h-9a1 1 0 01-1-1V4.5z" stroke="currentColor" stroke-width="1.6"/><path d="M6 8h6M6 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Moderation
      </button>
      <button type="button" data-go="settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M9 2.5v1.8M9 13.7v1.8M2.5 9h1.8M13.7 9h1.8M4.2 4.2l1.3 1.3M12.5 12.5l1.3 1.3M13.8 4.2l-1.3 1.3M5.5 12.5l-1.3 1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Settings / roles
      </button>
    </nav>
    <div class="side-foot">Stampd Admin<br>Edits stay in this browser<br><a href="../">Open app preview</a></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search" role="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="global-search" type="search" placeholder="Search places, users, countries…" aria-label="Search places, users, countries" autocomplete="off">
        <div id="search-pop" class="search-pop" hidden></div>
      </div>
      <span class="env" title="Static preview. Edits stay in this browser until you export JSON.">Preview</span>
      <div class="admin-chip">
        <div class="meta"><b>Arp</b><span>Admin</span></div>
        <div class="av" aria-hidden="true">AR</div>
      </div>
    </header>
    <div class="data-bar" id="data-bar">
      <span class="dirty" id="dirty-pill">Loading</span>
      <span class="data-meta" id="data-meta">Loading catalog…</span>
      <div class="ph-actions">
        <button type="button" class="btn btn-sm btn-secondary" id="btn-save">Save</button>
        <button type="button" class="btn btn-sm btn-secondary" id="btn-reset">Reset to repo</button>
        <button type="button" class="btn btn-sm btn-secondary" id="btn-export">Export JSON</button>
        <button type="button" class="btn btn-sm btn-secondary" id="btn-import">Import JSON</button>
      </div>
    </div>
    <div class="content" id="content">
      <section class="view on" data-view="overview" aria-label="Overview"><div class="ph"><div><h1>Overview</h1><p>Loading catalog…</p></div></div></section>
      <section class="view" data-view="countries" aria-label="Countries"></section>
      <section class="view" data-view="places" aria-label="Places and stamps"></section>
      <section class="view" data-view="users" aria-label="Users"></section>
      <section class="view" data-view="ads" aria-label="Ads and promotions"></section>
      <section class="view" data-view="trade" aria-label="Trade and coins"></section>
      <section class="view" data-view="moderation" aria-label="Moderation and support"></section>
      <section class="view" data-view="settings" aria-label="Settings and roles"></section>
    </div>
  </div>
</div>
<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file-import" accept="application/json,.json" multiple hidden>
<noscript><p style="padding:24px;font-family:sans-serif">Stampd Admin needs JavaScript. It only edits a copy in this browser.</p></noscript>
<script src="js/store.js?v=20261026"></script>
<script src="js/admin.js?v=20261026"></script>
</body>
</html>
